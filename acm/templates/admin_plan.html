{{define "content"}}
<section class="auth">
    <div class="auth__card">
        <p class="auth__eyebrow">Ledger №10 — Admin</p>
        <h1 class="auth__title">Create investment plan</h1>
        <p class="auth__subtitle">Define the terms and limits for a new investment plan.</p>

        <form method="POST" action="/admin/plans" class="auth__form">
            <div class="field">
                <label for="name">Plan name</label>
                <input id="name" type="text" name="name" placeholder="Growth Portfolio" required>
            </div>

            <div class="field">
                <label for="asset_class">Asset class</label>
                <input id="asset_class" type="text" name="asset_class" placeholder="Stocks" required>
            </div>

            <div class="field">
                <label for="duration">Duration (days)</label>
                <input id="duration" type="number" name="duration" min="1" placeholder="90" required>
            </div>

            <div class="field">
                <label for="rate_value">Total return over duration (%)</label>
                <input id="rate_value" type="number" name="rate_value" min="0" step="0.01" placeholder="20" required>
                <p class="field__hint">Compounded daily. E.g. 20 means $100 grows to $120 by the end of the plan's duration.</p>
            </div>

            <div class="field">
                <label for="min_deposit">Minimum deposit</label>
                <input id="min_deposit" type="number" name="min_deposit" min="0.01" step="0.01" placeholder="100" required>
            </div>

            <div class="field">
                <label for="max_deposit">Maximum deposit</label>
                <input id="max_deposit" type="number" name="max_deposit" min="0.01" step="0.01" placeholder="10000" required>
            </div>

            <button type="submit" class="btn btn--primary btn--block">Create plan</button>
        </form>

        <p class="auth__switch"><a href="/admin">← Back to admin</a></p>
    </div>
</section>
{{end}}
