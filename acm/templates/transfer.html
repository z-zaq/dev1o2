{{define "content"}}
<section class="auth">
    <div class="auth__card">
        <p class="auth__eyebrow">Ledger №4 — Transfer</p>
        <h1 class="auth__title">Transfer funds</h1>
        <p class="entry__balance">Available balance: <span>${{printf "%.2f" .Balance}}</span></p>

        <form method="POST" action="/transfer" class="auth__form">
            <div class="field">
                <label for="recipient">Recipient email</label>
                <input id="recipient" type="email" name="recipient" required autofocus>
            </div>
            <div class="field">
                <label for="amount">Amount (USD)</label>
                <input id="amount" type="number" step="0.01" min="0.01" max="{{printf "%.2f" .Balance}}" name="amount" required>
                <p class="field__hint">Cannot exceed your available balance.</p>
            </div>
            <button type="submit" class="btn btn--primary btn--block">Transfer</button>
        </form>

        <p class="auth__switch"><a href="/dashboard">← Back to dashboard</a></p>
    </div>
</section>
{{end}}
