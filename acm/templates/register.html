{{define "content"}}
<section class="auth">
    <div class="auth__card">
        <p class="auth__eyebrow">Ledger №2 — New entry</p>
        <h1 class="auth__title">Open an account</h1>
        <p class="auth__subtitle">Two minutes, no minimum deposit.</p>

        <form method="POST" action="/register" class="auth__form">
            <div class="field">
                <label for="name">Full name</label>
                <input id="name" type="text" name="name" required autocomplete="name">
            </div>
            <div class="field">
                <label for="email">Email</label>
                <input id="email" type="email" name="email" required autocomplete="email">
            </div>
            <div class="field">
                <label for="password">Password</label>
                <input id="password" type="password" name="password" required autocomplete="new-password" minlength="8">
                <p class="field__hint">At least 8 characters.</p>
            </div>
            <button type="submit" class="btn btn--primary btn--block">Open an account</button>
        </form>

        <p class="auth__switch">Already have an account? <a href="/login">Log in</a></p>
    </div>
</section>
{{end}}
