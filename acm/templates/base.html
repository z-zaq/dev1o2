<!DOCTYPE html>
<html lang="en">
    <head>
        <meta charset="UTF-8">
        <meta name="viewport" content="width=device-width, initial-scale=1.0">
        <title>Avalon Capital Miner</title>
        <link rel="preconnect" href="https://fonts.googleapis.com">
        <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
        <link href="https://fonts.googleapis.com/css2?family=Fraunces:opsz,wght@9..144,400;9..144,500;9..144,600&family=IBM+Plex+Sans:wght@400;500;600&family=IBM+Plex+Mono:wght@400;500&display=swap" rel="stylesheet">
        <link rel="stylesheet" href="/static/css/style.css">
    </head>
    <body>
        <script>
            // Stopgap nav-state toggle: the session cookie isn't HttpOnly yet,
            // so we can check for its presence client-side. This breaks once
            // the cookie is hardened later — see AGENT.md.
            document.documentElement.classList.add(
                document.cookie.indexOf('session=') !== -1 ? 'is-authed' : 'is-anon'
            );
        </script>
        <header class="site-header">
            <div class="site-header__inner">
                <a href="/" class="brand">
                    <span class="brand__mark">A</span>
                    <span class="brand__name">Avalon&nbsp;Capital&nbsp;Miner</span>
                </a>
                <nav class="site-nav">
                    <a href="/">Home</a>
                    <a href="/about">About</a>
                    <a href="/contact">Contact</a>

                    <a href="/login" class="nav-anon">Log in</a>
                    <a href="/register" class="site-nav__cta nav-anon">Open an account</a>

                    <a href="/dashboard" class="nav-authed">Dashboard</a>
                    <a href="/profile" class="nav-authed">Profile</a>
                    <a href="/logout" class="site-nav__logout nav-authed">Log out</a>
                </nav>
            </div>
        </header>

        <main>
            {{template "content" .}}
        </main>

        <footer class="site-footer">
            <div class="site-footer__inner">
                <div class="site-footer__brand">Avalon Capital Miner</div>
                <div class="site-footer__links">
                    <a href="/about">About</a>
                    <a href="/contact">Contact</a>
                    <a href="/login" class="nav-anon">Log in</a>
                    <a href="/register" class="nav-anon">Register</a>
                    <a href="/logout" class="nav-authed">Logout</a>
                </div>
                <div class="site-footer__legal">© 2026 Avalon Capital Miner. All figures are illustrative pending live account data.</div>
            </div>
        </footer>
    </body>
</html>
