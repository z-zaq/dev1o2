{{define "content"}}
<section class="auth">
    <div class="auth__card">
        <p class="auth__eyebrow">Ledger №4 — Deposit</p>
        <h1 class="auth__title">Make a deposit</h1>
        <p class="entry__balance">Current balance: <span>${{printf "%.2f" .Balance}}</span></p>

        <form method="POST" action="/deposit" class="auth__form">
            <div class="field">
                <label for="amount">Amount (USD)</label>
                <input id="amount" type="number" step="0.01" min="0.01" name="amount" required autofocus>
            </div>
            <button type="submit" class="btn btn--primary btn--block">Deposit</button>
        </form>

        <p class="auth__switch"><a href="/dashboard">← Back to dashboard</a></p>
    </div>
</section>
{{end}}
